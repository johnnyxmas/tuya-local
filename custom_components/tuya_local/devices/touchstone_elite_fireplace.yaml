name: Electric fireplace
products:
  - id: pw8ga39lnvadcsvu
    manufacturer: Touchstone
    model: Elite
entities:
  # Power (DP 1) and "Forbidden heat" (DP 107) together give off / heat /
  # fan_only. The heating position (DP 5) is the preset: H0, H1, H2 and
  # "Level 3" (thermostat, shown as "F" on the display). Writing a setpoint
  # switches it to Level 3; fan_only and off force H0, and off also resets
  # the setpoint to its minimum.
  - entity: climate
    translation_key: heater
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: heat_disable
            conditions:
              - dps_val: false
                value: heat
              - dps_val: true
                value: fan_only
      - id: 2
        name: temperature
        type: integer
        range:
          min: 19
          max: 30
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: f
                range:
                  min: 67
                  max: 86
                value_redirect: temp_set_f
      - id: 3
        name: current_temperature
        type: integer
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: f
                value_redirect: temp_current_f
      - id: 5
        name: preset_mode
        type: string
        mapping:
          - dps_val: "0"
            value: none
          - dps_val: "1"
            value: low
          - dps_val: "2"
            value: high
          - dps_val: "3"
            value: auto
      - id: 13
        name: temperature_unit
        type: string
        mapping:
          - dps_val: c
            value: C
          - dps_val: f
            value: F
      - id: 14
        name: temp_set_f
        type: integer
        range:
          min: 67
          max: 86
        hidden: true
      - id: 15
        name: temp_current_f
        type: integer
        hidden: true
      - id: 107
        type: boolean
        name: heat_disable
        hidden: true
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 13
        type: string
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
  - entity: select
    name: Flame brightness
    icon: "mdi:fire"
    dps:
      - id: 102
        type: string
        name: option
        mapping:
          - dps_val: "1"
            value: "1"
          - dps_val: "2"
            value: "2"
          - dps_val: "3"
            value: "3"
          - dps_val: "4"
            value: "4"
          - dps_val: "5"
            value: "5"
  - entity: select
    name: Flame color
    icon: "mdi:palette"
    dps:
      - id: 101
        type: string
        name: option
        mapping:
          - dps_val: "1"
            value: Orange
          - dps_val: "2"
            value: Blue
          - dps_val: "3"
            value: Yellow
          - dps_val: "4"
            value: Orange + Blue
          - dps_val: "5"
            value: Orange + Yellow
          - dps_val: "6"
            value: Blue + Yellow
  - entity: select
    name: Flame speed
