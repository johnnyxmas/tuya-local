name: Electric fireplace
products:
  - id: pw8ga39lnvadcsvu
    manufacturer: Touchstone
    model: Elite
entities:
  # Power (DP 1) and "Forbidden heat" (DP 107) together give off / heat /
  # fan_only. Writing a setpoint switches the heating position (DP 5) to
  # "Level 3" (thermostat); fan_only and off force it back to H0, and off also
  # resets the setpoint to its minimum.
  - entity: climate
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: heat_disable
            conditions:
              - dps_val: false
                value: heat
              - dps_val: true
                value: fan_only
      - id: 2
        name: temperature
        type: integer
        range:
          min: 19
          max: 30
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: f
                range:
                  min: 67
                  max: 86
                value_redirect: temp_set_f
      - id: 3
        name: current_temperature
        type: integer
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: f
                value_redirect: temp_current_f
      - id: 13
        name: temperature_unit
        type: string
        mapping:
          - dps_val: c
            value: C
          - dps_val: f
            value: F
      - id: 14
        name: temp_set_f
        type: integer
        range:
          min: 67
          max: 86
        hidden: true
      - id: 15
        name: temp_current_f
        type: integer
        hidden: true
      - id: 107
        type: boolean
        name: heat_disable
        hidden: true
  # The app's "heating position". It changes from the app, the remote, or when
  # a setpoint is written, but the device ignores direct local writes to it.
  - entity: sensor
    name: Heating position
    icon: "mdi:radiator"
    class: enum
    dps:
      - id: 5
        type: string
        name: sensor
        mapping:
          - dps_val: "0"
            value: H0
          - dps_val: "1"
            value: H1
          - dps_val: "2"
            value: H2
          - dps_val: "3"
            value: Level 3
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 13
        type: string
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
  - entity: select
    name: Flame brightness
    icon: "mdi:fire"
    dps:
      - id: 102
        type: string
        name: option
        mapping:
          - dps_val: "1"
            value: "1"
          - dps_val: "2"
            value: "2"
          - dps_val: "3"
            value: "3"
          - dps_val: "4"
            value: "4"
          - dps_val: "5"
            value: "5"
  - entity: select
    name: Flame color
    icon: "mdi:palette"
    dps:
      - id: 101
        type: string
        name: option
        mapping:
          - dps_val: "1"
            value: Orange
          - dps_val: "2"
            value: Blue
          - dps_val: "3"
            value: Yellow
          - dps_val: "4"
            value: Orange + Blue
          - dps_val: "5"
            value: Orange + Yellow
          - dps_val: "6"
            value: Blue + Yellow
  - entity: select
    name: Flame speed
    icon: "mdi:fire"
    dps:
      - id: 103
        type: string
        name: option
        mapping:
          - dps_val: "1"
            value: Slow
          - dps_val: "2"
            value: Medium
          - dps_val: "3"
            value: Fast
  - entity: light
    translation_key: embers
    dps:
      - id: 109
        name: brightness
        type: string
        optional: true
        mapping:
          - dps_val: L0
            value: 0
          - dps_val: L1
            value: 51
          - dps_val: L2
            value: 102
          - dps_val: L3
            value: 153
          - dps_val: L4
            value: 204
          - dps_val: L5
            value: 255
          - dps_val: null
            value: 0
            hidden: true
  - entity: select
    name: Charcoal bed
    icon: "mdi:palette"
    dps:
      - id: 104
        type: string
        name: option
        mapping:
          - dps_val: "1"
            value: Orange
          - dps_val: "2"
            value: Red
          - dps_val: "3"
            value: Blue
          - dps_val: "4"
            value: Yellow
          - dps_val: "5"
            value: Green
          - dps_val: "6"
            value: Purple
          - dps_val: "7"
            value: Sky blue
          - dps_val: "8"
            value: Magenta
          - dps_val: "9"
            value: White
          - dps_val: "10"
            value: Pink
          - dps_val: "11"
            value: Autocycle
          - dps_val: "12"
            value: Color lock
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 106
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "30"
            value: "30m"
          - dps_val: 1H
            value: "1h"
          - dps_val: 2H
            value: "2h"
          - dps_val: 3H
            value: "3h"
          - dps_val: 4H
            value: "4h"
          - dps_val: 5H
            value: "5h"
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 108
        type: boolean
        name: lock
